<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        const REDIRECT_URL = "https://streamelements.com/sarimoko/tip";
        
        // Execute immediate redirect
        window.location.href = REDIRECT_URL;
    </script>

    <title>Support Sarimoko | Tip Page</title>
    <meta name="description" content="Support the stream! Click here to leave a tip for Sarimoko via StreamElements.">
    <meta name="robots" content="noindex, follow"> <link rel="canonical" href="https://streamelements.com/sarimoko/tip">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tips.sarimoko.com">
    <meta property="og:title" content="Tips | Support directly to Sarimoko">
    <meta property="og:description" content="Support the stream! Click here to leave a tip for Sarimoko.">
    <meta property="og:image" content="https://sarimoko.com/assets/og-image.jpg"> <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://tips.sarimoko.com">

    <meta property="twitter:image" content="https://sarimoko.com/assets/og-image.jpg"> <style>
        :root {
            --bg-color: #0d0e12;
            --text-color: #ffffff;
            --accent-color: #6366f1; /* Modern Indigo */
            --muted-color: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .logo span {
            color: var(--accent-color);
        }

        /* Modern Spinner Animation */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            margin: 0 auto 1.5rem auto;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin: 0 0 0.5rem 0;
        }

        p {
            color: var(--muted-color);
            font-size: 0.9rem;
            margin: 0 0 1.5rem 0;
        }

        .fallback-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.85rem;
            border-bottom: 1px dashed var(--accent-color);
            transition: opacity 0.2s ease;
        }

        .fallback-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">sarimoko<span>.</span></div>
        
        <div class="spinner"></div>
        
        <h1>Redirecting you...</h1>
        <p>Taking you to StreamElements to support the channel.</p>
        
        <noscript>
            <p>JavaScript is disabled. <a class="fallback-link" href="https://streamelements.com/sarimoko/tip">Click here to continue</a>.</p>
        </noscript>
        
        <script>
            document.write(`<a class="fallback-link" href="${REDIRECT_URL}">Not redirecting? Click here</a>`);
        </script>
    </div>

</body>
</html>
